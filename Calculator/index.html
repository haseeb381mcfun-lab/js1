<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">

        <div class="display">
            <div class="calculation">248 + 52</div>
            <div class="answer">300</div>
        </div>

        <div class="buttons">

            <button class="red">AC</button>
            <button class="red second">DEL</button>
            <button class="gray-light">%</button>
            <button class="orange">÷</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="orange">×</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="orange">−</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="orange">+</button>

            <button class="zero">0</button>
            <button>.</button>
            <button class="equal">=</button>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
